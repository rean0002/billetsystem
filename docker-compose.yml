services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: billetsystem
      POSTGRES_USER: billetsystem
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Opret en .env-fil med DB_PASSWORD, se .env.example}
    ports:
      # 5433 på din Mac, så den ikke støder sammen med en anden Postgres på 5432
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Køres kun første gang, når databasen er tom
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "billetsystem", "-d", "billetsystem"]
      interval: 3s
      retries: 20

  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/billetsystem
      DB_PASSWORD: ${DB_PASSWORD}
      # Login på adminsiden via Clerk (se README). Nøglen er offentlig, men hører til jeres egen Clerk-app.
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-http://localhost:8081}
      # Mails går til Mailpit (se nedenfor), ikke ud på internettet
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_SMTP_AUTH: "false"
      MAIL_STARTTLS: "false"
      MAIL_FROM: ${MAIL_FROM:-Billetsystem <billetter@example.com>}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Lokal "mailserver" til udvikling: fanger alle mails, så de kan ses på http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"

volumes:
  db-data:
