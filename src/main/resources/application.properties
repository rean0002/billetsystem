spring.datasource.url=jdbc:postgresql://localhost:5432/billetsystem
spring.datasource.username=billetsystem

spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.port=8081

# ---- Mail ----
# Uden MAIL_HOST sendes ingen mails (bestillinger virker stadig). I Docker bruges Mailpit,
# som fanger alle mails og viser dem på http://localhost:8025, så der aldrig sendes rigtige mails ved en fejl.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
# Afsender, fx "Eventforeningen <billetter@example.com>", og evt. en anden adresse til svar
billetsystem.mail.from=${MAIL_FROM:Billetsystem <billetter@example.com>}
billetsystem.mail.reply-to=${MAIL_REPLY_TO:}

# ---- Bag en proxy ----
# Kører programmet bag en proxy eller load balancer (fx hos en hostingudbyder), skal FORWARD_HEADERS_STRATEGY
# sættes til "native". Ellers ser alle besøgende ud til at have proxyens IP-adresse, og login-spærringen pr. IP
# ville ramme alle på én gang. Brug kun "native", når proxyen er jeres egen, ellers kan IP-adressen forfalskes.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
