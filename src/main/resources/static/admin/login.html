<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin-login</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/clerk.js" defer></script>
    <script src="/js/login.js" defer></script>
</head>
<body>
<main class="page narrow">

    <header class="page-header">
        <p class="eyebrow">For arrangører</p>
        <h1>Admin-login</h1>
    </header>

    <p id="logged-out" class="card notice-ok" role="status" hidden>Du er logget ud.</p>

    <!-- Logget ind, men uden admin-rolle i Clerk -->
    <section id="forbidden" class="card" hidden>
        <p class="form-error" role="alert">Din konto har ikke adgang til adminsiden. Bed en arrangør om at give dig adgang.</p>
        <p class="hint" id="forbidden-user"></p>
        <button type="button" class="button secondary" id="sign-out">Log ud</button>
    </section>

    <p id="login-error" class="form-error" role="alert" hidden></p>

    <!-- Clerks login-formular indsættes her af login.js -->
    <div id="clerk-sign-in" class="clerk-sign-in"></div>

</main>
</body>
</html>
