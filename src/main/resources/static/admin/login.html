<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin-login</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/login.js" defer></script>
</head>
<body>
<main class="page narrow">

    <header class="page-header">
        <p class="eyebrow">For arrangører</p>
        <h1>Admin-login</h1>
    </header>

    <p id="logged-out" class="card notice-ok" role="status" hidden>Du er logget ud.</p>

    <!-- Formularen sendes direkte til Spring Security, som tjekker brugernavn og kodeord -->
    <form id="login-form" class="card" method="post" action="/admin/login">
        <p id="login-error" class="form-error" role="alert" hidden>Forkert brugernavn eller kodeord.</p>
        <p id="login-locked" class="form-error" role="alert" hidden>
            For mange forkerte forsøg. Af sikkerhedshensyn er login spærret i 15 minutter. Prøv igen senere.
        </p>

        <div class="field">
            <label for="username">Brugernavn</label>
            <input id="username" name="username" autocomplete="username" required autofocus>
        </div>

        <div class="field">
            <label for="password">Kodeord</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>

        <!-- CSRF-nøglen udfyldes af login.js -->
        <input type="hidden" id="csrf">

        <button type="submit" id="login-button" class="button primary" disabled>Log ind</button>
    </form>

</main>
</body>
</html>
