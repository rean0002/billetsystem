<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bestillinger · Admin</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/admin/admin.js" defer></script>
    <script src="/admin/bestillinger.js" defer></script>
</head>
<body class="admin">

<!-- Menuen er ens på alle adminsider -->
<header class="admin-bar">
    <div class="admin-bar-inner">
        <a class="brand" href="/admin/index.html">Billetsystem</a>
        <nav class="admin-nav" aria-label="Adminmenu">
            <a href="/admin/index.html">Overblik</a>
            <a href="/admin/bestillinger.html">Bestillinger</a>
            <a href="/admin/deltagere.html">Deltagere</a>
            <a href="/admin/billettyper.html">Billettyper</a>
            <a href="/admin/events.html">Events</a>
            <a href="/admin/betaling.html">Betaling</a>
        </nav>
        <!-- Alle sider viser tal for det valgte event. Valget huskes i browseren. -->
        <label class="event-picker">
            <span>Viser event:</span>
            <select id="event-select"></select>
        </label>
        <!-- Log ud skal være en POST med CSRF-nøgle, ellers kunne en anden side logge dig ud -->
        <form method="post" action="/admin/logout" class="logout">
            <span class="whoami" id="whoami"></span>
            <input type="hidden" id="logout-csrf">
            <button type="submit" class="link-button">Log ud</button>
        </form>
    </div>
</header>

<main class="page admin-page">
    <p id="page-error" class="form-error" role="alert" hidden></p>

    <header class="page-header row">
        <div>
            <p class="eyebrow">Bestillinger</p>
            <h1>Bestillinger</h1>
        </div>
        <a class="button secondary" href="/api/admin/orders.csv" data-event-link>Hent som Excel (CSV)</a>
    </header>

    <div class="toolbar">
        <div class="filter-tabs" id="status-tabs" role="group" aria-label="Filtrér på status"></div>
        <label class="search">
            <span class="visually-hidden">Søg</span>
            <input type="search" id="search" placeholder="Søg på navn, e-mail, telefon eller nr.">
        </label>
    </div>

    <section class="card flush">
        <table class="data-table clickable" id="orders-table">
            <thead>
            <tr>
                <th>Nr.</th><th>Bestilt</th><th>Kontaktperson</th>
                <th class="num">Billetter</th><th class="num">Beløb</th><th>Status</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
        <p class="empty" id="orders-empty" hidden>Ingen bestillinger matcher.</p>
    </section>

    <!-- Detaljer om én bestilling. <dialog> er et indbygget vindue i browseren. -->
    <dialog id="order-dialog" class="dialog" aria-labelledby="dialog-title">
        <div class="dialog-head">
            <h2 id="dialog-title"></h2>
            <button type="button" class="link-button" id="dialog-close">Luk</button>
        </div>
        <div id="dialog-body"></div>
    </dialog>

</main>
</body>
</html>
