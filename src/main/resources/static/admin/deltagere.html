<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Deltagere · Admin</title>
    <!-- Skrifttyper: Bricolage Grotesque (overskrifter) og Instrument Sans (tekst) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/admin/admin.js" defer></script>
    <script src="/admin/deltagere.js" defer></script>
</head>
<body class="admin">

<!-- Menuen er ens på alle adminsider -->
<header class="admin-bar">
    <div class="admin-bar-inner">
        <a class="brand" href="/admin/index.html">Billetsystem</a>
        <nav class="admin-nav" aria-label="Adminmenu">
            <a href="/admin/index.html">Overblik</a>
            <a href="/admin/bestillinger.html">Bestillinger</a>
            <a href="/admin/deltagere.html">Deltagere</a>
            <a href="/admin/billettyper.html">Billettyper</a>
            <a href="/admin/events.html">Events</a>
            <a href="/admin/betaling.html">Betaling</a>
        </nav>
        <!-- Alle sider viser tal for det valgte event. Valget huskes i browseren. -->
        <label class="event-picker">
            <span>Viser event:</span>
            <select id="event-select"></select>
        </label>
        <!-- Log ud skal være en POST med CSRF-nøgle, ellers kunne en anden side logge dig ud -->
        <form method="post" action="/admin/logout" class="logout">
            <span class="whoami" id="whoami"></span>
            <input type="hidden" id="logout-csrf">
            <button type="submit" class="link-button">Log ud</button>
        </form>
    </div>
</header>

<main class="page admin-page">
    <p id="page-error" class="form-error" role="alert" hidden></p>

    <header class="page-header row">
        <div>
            <p class="eyebrow">Deltagere</p>
            <h1>Deltagerliste</h1>
            <p class="hint" id="participant-summary"></p>
        </div>
        <div class="actions">
            <button type="button" class="button secondary" id="print">Print tjekind-liste</button>
            <a class="button secondary" href="/api/admin/participants.csv" data-event-link>Hent som Excel (CSV)</a>
        </div>
    </header>

    <div class="toolbar">
        <label class="search">
            <span class="visually-hidden">Søg</span>
            <input type="search" id="search" placeholder="Søg på deltager, kontaktperson eller e-mail">
        </label>
        <label class="select">
            <span class="visually-hidden">Billettype</span>
            <select id="ticket-type"><option value="">Alle billettyper</option></select>
        </label>
        <label class="checkbox">
            <input type="checkbox" id="include-cancelled"> Vis annullerede
        </label>
    </div>

    <section class="card flush">
        <table class="data-table" id="participants-table">
            <thead>
            <tr>
                <th class="print-only check-col">Mødt</th>
                <th>Navn</th><th>Billettype</th><th>Status</th><th>Bestilling</th><th class="no-print">Kontakt</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
        <p class="empty" id="participants-empty" hidden>Ingen deltagere matcher.</p>
    </section>

</main>
</body>
</html>
